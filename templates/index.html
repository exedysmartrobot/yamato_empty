<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>搬送ロボット 操作パネル</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
        <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet" />
    </head>
    <body>
        <div class="app">
            <!-- ============ ヘッダ ============ -->
            <header>
                <div class="status">
                    <i id="lamp"></i>
                    <span id="status-text" data-i18n="statusWaiting">読み取り待ち</span>
                </div>
                <div class="header-right">
                    <nav class="langs">
                        <button id="lang-ja" class="active">日本語</button>
                        <button id="lang-en">English</button>
                    </nav>
                    <button id="fullscreen-button" title="全画面 / Fullscreen">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 8V4a1 1 0 0 1 1-1h4M16 3h4a1 1 0 0 1 1 1v4M21 16v4a1 1 0 0 1-1 1h-4M8 21H4a1 1 0 0 1-1-1v-4" />
                        </svg>
                    </button>
                </div>
            </header>

            <!-- ============ 工程バー ============ -->
            <nav class="steps">
                <div class="step" id="step-scan">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 21s-7-6.3-7-11a7 7 0 0 1 14 0c0 4.7-7 11-7 11z" />
                        <circle cx="12" cy="10" r="2.5" />
                    </svg>
                    <span data-i18n="stepScan">スキャン</span>
                </div>
                <div class="step" id="step-drive">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 7h12v9H1zM13 10h4l3 3v3h-7z" />
                        <circle cx="6" cy="18" r="2" />
                        <circle cx="17" cy="18" r="2" />
                    </svg>
                    <span data-i18n="stepDrive">走行</span>
                </div>
                <div class="step" id="step-unload">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2v8M8.5 7.5L12 11l3.5-3.5" />
                        <path d="M3 13h18v8H3z" />
                    </svg>
                    <span data-i18n="stepUnload">荷降ろし</span>
                </div>
                <div class="step" id="step-return">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z" />
                    </svg>
                    <span data-i18n="stepReturn">帰還</span>
                </div>
            </nav>

            <!-- ============ 画面（すべてここに置いて、activeのものだけ表示） ============ -->
            <div class="content">
                <!-- 待機（行き先選択） -->
                <section class="screen active" id="screen-waiting">
                    <div class="pictogram pulse">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 21s-7-6.3-7-11a7 7 0 0 1 14 0c0 4.7-7 11-7 11z" />
                            <circle cx="12" cy="10" r="2.5" />
                        </svg>
                    </div>
                    <div class="message" data-i18n="scanPrompt">行き先を選んでください</div>
                    <div class="destinations">
                        <button class="dest-button" data-dest="A">StationA</button>
                        <button class="dest-button" data-dest="B">StationB</button>
                        <button class="dest-button" data-dest="C">StationC</button>
                    </div>
                </section>

                <!-- テンキー入力 -->
                <section class="screen" id="screen-keypad">
                    <p class="caption" data-i18n="keypadPrompt">行き先番号を入力</p>
                    <div id="keypad-display" class="empty">– – –</div>
                    <div class="keypad">
                        <button class="digit" data-digit="1">1</button>
                        <button class="digit" data-digit="2">2</button>
                        <button class="digit" data-digit="3">3</button>
                        <button class="digit" data-digit="4">4</button>
                        <button class="digit" data-digit="5">5</button>
                        <button class="digit" data-digit="6">6</button>
                        <button class="digit" data-digit="7">7</button>
                        <button class="digit" data-digit="8">8</button>
                        <button class="digit" data-digit="9">9</button>
                        <button class="backspace" id="keypad-backspace">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 5H9l-6 7 6 7h11a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z" />
                                <path d="M17 9l-5 6M12 9l5 6" />
                            </svg>
                        </button>
                        <button class="digit" data-digit="0">0</button>
                        <button class="confirm" id="keypad-confirm">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 12.5l5 5L20 6.5" />
                            </svg>
                        </button>
                    </div>
                </section>

                <!-- エラー -->
                <section class="screen" id="screen-error">
                    <div class="pictogram error pulse">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="9" />
                            <path d="M12 7v6M12 17h.01" />
                        </svg>
                    </div>
                    <div class="message small" id="error-message" data-i18n="notRegistered">この番号は登録されていません</div>
                    <!-- <p class="raw"> の行を削除 -->
                </section>

                <!-- 読み取り完了 -->
                <section class="screen" id="screen-scanned">
                    <p class="caption" data-i18n="destination">行き先</p>
                    <div class="number" id="scanned-number">–</div>
                    <div class="waypoint" id="scanned-waypoint"></div>
                    <!-- <p class="raw"> の行を削除 -->
                </section>

                <!-- 走行中 -->
                <section class="screen" id="screen-driving">
                    <p class="caption inline">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 7h12v9H1zM13 10h4l3 3v3h-7z" />
                            <circle cx="6" cy="18" r="2" />
                            <circle cx="17" cy="18" r="2" />
                        </svg>
                        <span data-i18n="destination">行き先</span>
                    </p>
                    <div class="number" id="driving-number">–</div>
                    <div class="progress"><i id="driving-progress"></i></div>
                </section>

                <!-- 荷降ろし中 -->
                <section class="screen" id="screen-unloading">
                    <div class="pictogram busy">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2v8M8.5 7.5L12 11l3.5-3.5" />
                            <path d="M3 13h18v8H3z" />
                        </svg>
                    </div>
                    <div class="number small" id="unloading-number">–</div>
                    <div class="message small" data-i18n="unloading">荷降ろし中</div>
                </section>

                <!-- 帰還中 -->
                <section class="screen" id="screen-returning">
                    <div class="pictogram busy">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z" />
                        </svg>
                    </div>
                    <div class="message" data-i18n="returning">出発地へ戻る</div>
                    <div class="progress"><i id="returning-progress"></i></div>
                </section>

                <!-- 完了 -->
                <section class="screen" id="screen-done">
                    <div class="pictogram">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 12.5l5 5L20 6.5" />
                        </svg>
                    </div>
                    <div class="number small" id="done-number">–</div>
                    <div class="message small" data-i18n="completed">搬送完了</div>
                </section>
            </div>

            <!-- ============ 操作ボタン（画面ごとにグループを切り替え） ============ -->
            <div class="actions">
                <div class="action-group active" id="actions-waiting">
                    <button class="secondary" id="open-keypad-button" style="display: none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="4" y="3" width="16" height="18" rx="2" />
                            <path d="M8 7h.01M12 7h.01M16 7h.01M8 12h.01M12 12h.01M16 12h.01M8 17h.01M12 17h.01M16 17h.01" />
                        </svg>
                        <span data-i18n="btnKeypad">番号入力</span>
                    </button>
                </div>

                <div class="action-group" id="actions-keypad">
                    <button class="secondary" id="keypad-back-button">
                        <span data-i18n="btnBack">戻る</span>
                    </button>
                </div>

                <div class="action-group" id="actions-error">
                    <button class="danger" id="error-rescan-button">
                        <span data-i18n="btnBackToSelect">選択画面へ戻る</span>
                    </button>
                </div>

                <div class="action-group" id="actions-scanned">
                    <button class="secondary" id="rescan-button">
                        <span data-i18n="btnRescan">読み直す</span>
                    </button>
                    <button class="primary" id="start-driving-button">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 11l18-8-8 18-2-8-8-2z" />
                        </svg>
                        <span data-i18n="btnStart">走行開始</span>
                    </button>
                </div>

                <div class="action-group" id="actions-driving">
                    <button class="danger" id="stop-driving-button">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="6" y="6" width="12" height="12" rx="2" />
                        </svg>
                        <span data-i18n="btnStop">停止</span>
                    </button>
                </div>

                <div class="action-group" id="actions-unloading"></div>

                <div class="action-group" id="actions-returning">
                    <button class="danger" id="stop-returning-button">
                        <span data-i18n="btnStop">停止</span>
                    </button>
                    <button class="secondary" id="returned-button">
                        <span data-i18n="btnDemo">次へ（デモ）</span>
                    </button>
                </div>

                <div class="action-group" id="actions-done">
                    <button class="primary" id="next-scan-button">
                        <span data-i18n="btnNext">次へ</span>
                    </button>
                </div>
            </div>
        </div>
        <!-- ============ 確認ポップアップ ============ -->
        <div class="modal-overlay" id="confirm-modal">
            <div class="modal">
                <p class="modal-title" data-i18n="confirmTitle">この行き先へ搬送しますか？</p>
                <div class="modal-dest" id="confirm-dest">–</div>
                <div class="modal-actions">
                    <button class="modal-cancel" id="confirm-cancel">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 6L6 18M6 6l12 12" />
                        </svg>
                        <span data-i18n="btnCancel">キャンセル</span>
                    </button>
                    <button class="modal-ok" id="confirm-ok">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 11l18-8-8 18-2-8-8-2z" />
                        </svg>
                        <span data-i18n="btnConfirm">開始する</span>
                    </button>
                </div>
            </div>
        </div>
        <script src="{{ url_for('static', filename='js/server.js') }}"></script>
        <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    </body>
</html>
